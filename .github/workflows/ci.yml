name: CI

on:
  push:
    branches: [main, master, gui]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Binary sizes
        shell: pwsh
        run: Get-ChildItem target\release\lghub-lite*.exe | Format-Table Name, Length

  msrv:
    # The core's rust-version (CLI + background watcher) must really build.
    # The GUI follows eframe's own minimum (see gui/Cargo.toml).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo build -p lghub-lite
