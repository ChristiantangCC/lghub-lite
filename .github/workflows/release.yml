name: Release

# Push a tag like v0.1.0 to build and publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: cargo test
        working-directory: gui
      - run: cargo build --release
        working-directory: gui
      - name: Package
        shell: pwsh
        run: ./packaging/package-windows.ps1 -Version "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: lghub-lite-*-windows-x64.zip*

  linux:
    # Experimental: built and unit-tested here, not tested on Linux hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - run: cargo test
        working-directory: gui
      - run: cargo build --release
        working-directory: gui
      - name: Package
        run: sh packaging/package-linux.sh "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: lghub-lite-*-linux-x64-experimental.tar.gz*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" lghub-lite-* \
            --repo "${{ github.repository }}" \
            --title "lghub-lite ${{ github.ref_name }}" --generate-notes --prerelease
