name: Release

# Push a tag like v0.1.0 to build and publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "lghub-lite-$tag-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target\release\lghub-lite-gui.exe, target\release\lghub-lite.exe, target\release\lghub-lite-bg.exe, README.md, LICENSE $name
          Compress-Archive -Path "$name\*" -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
          "ASSET=$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ASSET.zip" "$env:ASSET.zip.sha256" `
            --title "lghub-lite ${{ github.ref_name }}" --generate-notes --prerelease
