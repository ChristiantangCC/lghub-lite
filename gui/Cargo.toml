[package]
name = "lghub-lite-gui"
version = "0.2.0"
edition = "2024"
rust-version = "1.95" # eframe 0.37
description = "Window + tray front end for lghub-lite. Not affiliated with or endorsed by Logitech."
license = "MIT"
repository = "https://github.com/Skyttehehe/lghub-lite"
publish = false

# A project of its own, not part of the root: the CLI builds without it, and gui/ can be deleted.
[workspace]

[[bin]]
name = "lghub-lite-gui"
path = "src/main.rs"

[dependencies]
lghub-lite = { path = ".." }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
raw-window-handle = "0.6" # already part of eframe; gives the HWND for the borderless fix

[target.'cfg(target_os = "linux")'.dependencies]
# X11 and Wayland window support, and a StatusNotifierItem tray over D-Bus (no GTK)
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",    # open/save dialogs for skin files
    "Win32_UI_HiDpi",               # icon sizes for the system DPI
    "Win32_UI_Shell",               # window subclass: borderless window without the 1 px top line
    "Win32_UI_WindowsAndMessaging", # show/hide the window from the tray
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
